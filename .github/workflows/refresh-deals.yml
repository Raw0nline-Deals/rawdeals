name: Daily deal refresh

on:
  schedule:
    # 13:00 UTC is 7:00 AM Central Standard Time.
    - cron: "0 13 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - data/asins.json
      - data/discovery.json
      - data/deals.json

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-deals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Choose whether to call Amazon
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          live=true
          if [ "$EVENT_NAME" = "push" ]; then
            live=false
            files="$(jq -r '[.commits[]?.added[]?, .commits[]?.modified[]?, .commits[]?.removed[]?] | unique | .[]' "$GITHUB_EVENT_PATH")"
            printf '%s\n' "$files"
            if [ -z "$files" ] || printf '%s\n' "$files" | grep -Eq '^(data/asins\.json|data/discovery\.json)$'; then
              live=true
            fi
          fi
          echo "live=$live" >> "$GITHUB_OUTPUT"

      - name: Refresh deals from the Creators API
        if: steps.plan.outputs.live == 'true'
        env:
          CREATORS_API_CREDENTIAL_ID: ${{ secrets.CREATORS_API_CREDENTIAL_ID }}
          CREATORS_API_CREDENTIAL_SECRET: ${{ secrets.CREATORS_API_CREDENTIAL_SECRET }}
          CREATORS_API_CREDENTIAL_VERSION: "3.1"
        run: node scripts/fetch-deals.js --live

      - name: Clear shared dead flags for deals still on the site
        env:
          DEAD_DEALS_TOKEN: ${{ secrets.DEAD_DEALS_TOKEN }}
          DEAD_DEALS_API_URL: ${{ vars.DEAD_DEALS_API_URL }}
        run: node scripts/verify-dead-deals.js --reconcile

      - name: Rebuild the RSS feed
        run: node scripts/build-feed.js

      - name: Commit deals.json and feed.xml if they changed
        id: commit
        run: |
          git add -- data/deals.json feed.xml
          if git diff --cached --quiet; then
            echo "deals.json and feed.xml unchanged"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily deal refresh"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "/repos/${{ github.repository }}/pages/builds"; then
            echo "::warning::GitHub Pages rebuild request failed"
          fi
